<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revive - Sign In</title>
    <link rel="stylesheet" href="../css/signin.css">
</head>
<body>
    <div class="container">
        <div class="welcome-section">
            <h1>Welcome back!</h1>
            <p>Make your weardrobe more with less</p>
            <div class="app-name">with Revive Project</div>
            <div class="back-home">
                <a href="../html/home.html">← Back to Home</a>
            </div>
        </div>
        
        <div class="signin-section">
            <h2>Sign in to your account</h2>
            <form id="signinForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                    <div class="error-message" id="usernameError">Please enter your username</div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
                </div>
                
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="signin-btn">Sign In</button>
                
                <div class="signup-link">
                    Don't have an account? <a href="../html/signup.html">Sign up</a>
                </div>

                <!-- Error message for login failure -->
                <div class="error-message" id="loginError" style="display: none; text-align: center; margin-top: 15px;">
                    Invalid username or password
                </div>
            </form>
        </div>
    </div>

    <!-- Include the users data and authentication system -->
    <script src="../js/users-data.js"></script>
    <script src="../js/auth-system.js"></script>
    <script src="../js/signin.js"></script>
</body>
</html>
