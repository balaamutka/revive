<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revive Project - Chat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <!-- Видалено login-screen -->

    <div id="offer-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Create Offer</h3>
            <p style="text-align: center; color: #666; font-size: 13px; margin-bottom: 20px;">
                Edit the final price and duration.
            </p>
            <div class="form-group">
                <label>Total Price ($)</label>
                <input type="number" id="offer-price" value="50">
            </div>
            <div class="form-group">
                <label>Duration (days)</label>
                <input type="text" id="offer-time" value="10 days">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-submit" onclick="submitCrafterOffer()">Send Offer</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <header>
            <div class="logo">Revive</div>
            <div class="header-profile" id="header-profile-block" title="Go to Profile"></div>
        </header>

        <div class="workspace">
            <aside class="sidebar">
                <h3>Status</h3>
                <div id="timeline-container"></div>
                
                <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #eee;">
                    <a href="../html/master_dashboard.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #666; font-size: 14px; margin-bottom: 10px;">
                        ← Back to Dashboard
                    </a>
                </div>
            </aside>

            <main class="chat-area">
                <div id="crafter-toolbar" class="crafter-panel">
                    <span>🔔 <b>Crafter Action:</b> <span id="crafter-hint">Waiting...</span></span>
                    <button id="crafter-action-btn" class="action-btn" onclick="handleCrafterAction()">Execute</button>
                </div>

                <div class="chat-slogan">
                    <span>Revive your clothes not your ex</span>
                </div>

                <div class="messages-list" id="chat-history">
                    <div style="text-align: center; color: #999; font-size: 11px;">Today</div>
                </div>

                <div class="input-area">
                    <input type="text" class="message-input" id="msgInput" placeholder="Type a message...">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </main>
        </div>
    </div>
    

    <script src="../js/users-data.js"></script>
    <script src="../js/auth-system.js"></script>
    <script src="../js/chat.js"></script>
</body>
</html>
